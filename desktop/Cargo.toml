[workspace]
resolver = "2"
members = ["crates/protocol", "crates/jitter", "crates/dsp", "crates/engine", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
# small and fast: this runs all day in the tray next to a game
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

# Dev builds run the neural model, which is unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.clearmic-dsp]
opt-level = 3
[profile.dev.package.clearmic-engine]
opt-level = 3
