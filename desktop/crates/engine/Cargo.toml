[package]
name = "sonivane-engine"
version.workspace = true
edition.workspace = true

[features]
dfn3 = ["sonivane-dsp/dfn3"]
dpdfnet = ["sonivane-dsp/dpdfnet"]

[dependencies]
sonivane-protocol = { path = "../protocol" }
sonivane-jitter = { path = "../jitter" }
sonivane-dsp = { path = "../dsp" }
cpal = "0.15"
rtrb = "0.3"
hound = "3.5"
opus-decoder = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
