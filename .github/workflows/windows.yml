# Builds the Windows installer (ClearMic_x.y.z_x64-setup.exe). Run it from the Actions tab.
name: windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test the engine and app state
        working-directory: desktop
        continue-on-error: true   # a failing test should not stop the installer from being built
        run: cargo test --workspace
      - name: Build the installer
        working-directory: desktop/app/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: clearmic-windows
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
